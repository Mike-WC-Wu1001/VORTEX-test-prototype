/* VORTEX Views prototype — LUMIXIS tokens only (tokens.css is prepended at build). */

:root {
  --font: var(--font-zh-hant);
  --motion-duration-fast: 150ms;
  --motion-duration-normal: 200ms;
  --motion-duration-slow: 300ms;
  --motion-easing-ease-out: cubic-bezier(0, 0, 0.2, 1);
  --motion-easing-ease-in: cubic-bezier(0.4, 0, 1, 1);
  --motion-easing-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-primary); background: var(--semantic-color-background-surface-default); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
input { font-family: inherit; }
h1, h2, h3, p { margin: 0; }

/* Scrollbar: one global rule (Scrollbar contract) */
html { scrollbar-width: thin; scrollbar-color: var(--semantic-color-background-thumb-default) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--semantic-color-background-thumb-default); border: 4px solid transparent; background-clip: padding-box; border-radius: 9999px; min-height: 44px; }
::-webkit-scrollbar-thumb:hover { background-color: var(--semantic-color-background-thumb-hover); }
::-webkit-scrollbar-track { background: transparent; }

.tabular { font-feature-settings: "tnum" 1, "lnum" 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- App frame ---------- */
.app { display: flex; height: 100vh; min-width: 1280px; }
.rail { flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--space-stack-050); width: 80px; padding: var(--space-inset-200) var(--space-inset-050); background: var(--semantic-color-background-surface-subtler); border-right: 1px solid var(--semantic-color-border-subtle); }
.rail .org { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: var(--space-stack-200); border: 0; border-radius: var(--radius-sm); background: var(--semantic-color-foreground-primary); color: var(--semantic-color-foreground-inverse); font: 600 16px/22px var(--font); cursor: default; }
.rail .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-stack-025); width: 72px; height: 64px; border: 0; border-radius: var(--radius-sm); background: none; font: 600 10px/14px var(--font); color: var(--semantic-color-foreground-secondary); cursor: default; }
.rail .tile[aria-current="page"] { background: var(--semantic-color-background-neutral-selected); color: var(--semantic-color-foreground-primary); }
.rail .spacer { flex: 1; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { flex: none; display: flex; align-items: center; gap: var(--space-gap-300); height: 72px; padding: 0 var(--space-inset-300); border-bottom: 1px solid var(--semantic-color-border-subtle); }
.topbar h1 { font: 600 28px/40px var(--font); }
.body { flex: 1; min-height: 0; display: flex; }

/* Tab switch (Tab contract, switch track) */
.switch-track { display: inline-flex; gap: var(--space-gap-100); padding: var(--space-inset-050); border-radius: var(--radius-round); background: var(--semantic-color-background-recessed-default); }
.switch-track [role="tab"] { height: 32px; min-width: 64px; padding: 0 var(--space-inset-150); border: 0; border-radius: var(--radius-round); background: none; font: 600 14px/20px var(--font); color: var(--semantic-color-foreground-secondary); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-gap-050); }
.switch-track [role="tab"]:hover { color: var(--semantic-color-foreground-primary); }
.switch-track [aria-selected="true"] { background: var(--semantic-color-background-neutral-default); color: var(--semantic-color-foreground-primary); box-shadow: 0 0 0 1px var(--semantic-color-border-subtle); }
.switch-track.lg [role="tab"] { height: 40px; padding: 0 var(--space-inset-200); }

/* ---------- Buttons (Button contract) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-gap-050); height: 40px; min-width: 64px; padding: 0 var(--space-inset-150); border: 0; border-radius: var(--radius-sm); font: 600 14px/20px var(--font); white-space: nowrap; transition: background var(--motion-duration-normal); }

.btn[data-type="ghost"]:disabled, .btn[data-icon="only"]:disabled { background: none; }
.btn[data-type="link"] { height: auto; min-width: 0; padding: 0 var(--space-inset-025); background: none; color: var(--semantic-color-foreground-brand); }
.btn[data-type="link"]:hover { text-decoration: underline; }
.btn.outline { background: var(--semantic-color-background-neutral-default); box-shadow: inset 0 0 0 1px var(--semantic-color-border-bold); color: var(--semantic-color-foreground-primary); }

/* ---------- Checkbox (Checkbox contract) ---------- */
.cb { position: relative; flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; cursor: pointer; }
.cb input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: inherit; }
.cb .box { display: grid; place-items: center; width: 20px; height: 20px; border: 1.5px solid var(--semantic-color-border-accent-gray); border-radius: var(--radius-xs); background: var(--semantic-color-background-neutral-default); color: var(--semantic-color-foreground-static); transition: background var(--motion-duration-normal); }

.cb[data-disabled="true"] { cursor: not-allowed; }
.cb[data-disabled="true"] .box { border-color: var(--semantic-color-border-default); background: var(--semantic-color-action-disabled-subtle); }
.cb[data-disabled="true"][data-state="checked"] .box { background: var(--semantic-color-action-disabled-default); }

/* ---------- Search (Search contract) ---------- */
.search { display: flex; align-items: center; gap: var(--space-gap-100); height: 40px; padding: 0 var(--space-inset-150); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-round); background: var(--semantic-color-background-neutral-default); color: var(--semantic-color-foreground-tertiary); }
.search:hover { background: var(--semantic-color-background-neutral-subtle-hover); }
.search:focus-within { border: 2px solid var(--semantic-color-border-brand-default); padding: 0 calc(var(--space-inset-150) - 1px); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-primary); }
.search input::placeholder { color: var(--semantic-color-foreground-tertiary); }
.search .clear { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: var(--radius-round); background: none; color: var(--semantic-color-foreground-secondary); }

/* ---------- Left panel ---------- */
.panel { flex: none; display: flex; flex-direction: column; width: 320px; min-height: 0; border-right: 1px solid var(--semantic-color-border-subtle); background: var(--semantic-color-background-surface-default); }
.panel-pad { padding: 0 var(--space-inset-200); }
.ws-card { display: flex; align-items: center; gap: var(--space-gap-150); width: 100%; margin: var(--space-stack-200) 0; padding: var(--space-inset-150); border: 0; border-radius: var(--radius-sm); background: var(--semantic-color-background-surface-bold); text-align: left; }
.ws-card:hover { background: var(--semantic-color-background-surface-bolder); }
.ws-card[aria-current="true"] { background: var(--semantic-color-action-brand-subtle-default); box-shadow: inset 0 0 0 2px var(--semantic-color-border-brand-default); }
.ws-card .ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--semantic-color-action-brand-default); color: var(--semantic-color-foreground-static); flex: none; }
.ws-card .t { font: 600 16px/22px var(--font); }
.ws-card .s { font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.divider { height: 1px; background: var(--semantic-color-border-default); margin: 0 var(--space-inset-200); flex: none; }

.sec { display: flex; flex-direction: column; min-height: 0; }
.sec-head { flex: none; display: flex; align-items: center; gap: var(--space-gap-050); height: 40px; padding: 0 var(--space-inset-100) 0 var(--space-inset-200); margin-top: var(--space-stack-100); }
.sec-head button.toggle { display: flex; align-items: center; gap: var(--space-gap-050); flex: 1; height: 32px; padding: 0 var(--space-inset-050); margin-left: calc(-1 * var(--space-inset-050)); border: 0; border-radius: var(--radius-xs); background: none; font: 600 12px/16px var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--semantic-color-foreground-secondary); text-align: left; }
.sec-head button.toggle:hover { color: var(--semantic-color-foreground-primary); }
.sec-head .count { font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-tertiary); padding-right: var(--space-inset-100); }
.sec-body { min-height: 0; overflow-y: auto; padding: 0 var(--space-inset-100) var(--space-inset-100); }
.group-label { padding: var(--space-inset-100) var(--space-inset-100) var(--space-inset-050); font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-tertiary); }

.view-row { display: flex; align-items: center; gap: var(--space-gap-100); width: 100%; min-height: 48px; padding: var(--space-inset-075) var(--space-inset-100); border: 0; border-radius: var(--radius-sm); background: none; text-align: left; }
.view-row:hover { background: var(--semantic-color-background-neutral-hover); }
.view-row[aria-current="true"] { background: var(--semantic-color-background-neutral-selected); }
.view-row .ico { color: var(--semantic-color-foreground-secondary); flex: none; }
.view-row .n { font: 600 14px/20px var(--font); }
.view-row .s { font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.empty-line { padding: var(--space-inset-100) var(--space-inset-200); font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-secondary); }

/* camera tree */
.site-row { display: flex; align-items: center; gap: var(--space-gap-050); height: 40px; padding: 0 var(--space-inset-100) 0 var(--space-inset-050); border-radius: var(--radius-sm); }
.site-row:hover { background: var(--semantic-color-background-neutral-hover); }
.site-row .chev { display: grid; place-items: center; width: 24px; height: 24px; border: 0; background: none; border-radius: var(--radius-xs); color: var(--semantic-color-foreground-secondary); padding: 0; }
.site-row .nm { flex: 1; font: 600 14px/20px var(--font); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-row .ct { font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.cam-row { display: flex; align-items: center; gap: var(--space-gap-100); padding: var(--space-inset-050) var(--space-inset-100) var(--space-inset-050) 28px; border-radius: var(--radius-sm); cursor: grab; }
.cam-row:hover { background: var(--semantic-color-background-neutral-hover); }
.thumb { position: relative; flex: none; width: 176px; height: 99px; border-radius: var(--radius-xs); overflow: hidden; background: var(--semantic-color-media-background-default); background-size: cover; }
.thumb .nm { position: absolute; left: var(--space-inset-100); right: var(--space-inset-100); bottom: var(--space-inset-050); font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-static); text-shadow: var(--shadow-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.off::after { content: ""; position: absolute; inset: 0; background: var(--semantic-color-media-background-overlay-default); }
.thumb.off .nm { z-index: 1; }
.cam-meta { display: flex; align-items: center; gap: var(--space-gap-050); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: var(--radius-round); background: var(--semantic-color-status-background-online); }
.dot.off { background: var(--semantic-color-status-background-offline); }
.on-txt { color: var(--semantic-color-feedback-foreground-success); }

.full-note { margin: 0 var(--space-inset-200) var(--space-stack-100); padding: var(--space-inset-100) var(--space-inset-150); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-sm); background: var(--semantic-color-feedback-background-info-subtlest); display: flex; flex-direction: column; gap: var(--space-stack-100); font: 400 13px/18px var(--font); }
.full-note .row { display: flex; gap: var(--space-gap-100); align-items: flex-start; color: var(--semantic-color-foreground-primary); }
.full-note .row svg { flex: none; margin-top: 0; color: var(--semantic-color-feedback-foreground-info); }

/* Sites list (Tree view) */
.tree-row { display: flex; align-items: center; gap: var(--space-gap-050); height: 40px; padding: 0 var(--space-inset-100); border: 0; border-radius: var(--radius-sm); background: none; width: 100%; text-align: left; font: 600 14px/20px var(--font); color: var(--semantic-color-foreground-primary); }
.tree-row:hover { background: var(--semantic-color-background-neutral-hover); }
.tree-row[aria-selected="true"] { background: var(--semantic-color-background-neutral-selected); }
.tree-row .chev { display: grid; place-items: center; width: 20px; color: var(--semantic-color-foreground-secondary); }
.tree-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row .ct { font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.tree-row.leaf { padding-left: 32px; font-weight: 400; color: var(--semantic-color-foreground-secondary); gap: var(--space-gap-100); }
.tree-row.leaf:hover { color: var(--semantic-color-foreground-primary); }
.tree-row.leaf[aria-selected="true"] { color: var(--semantic-color-foreground-primary); font-weight: 600; }
.sites-meta { display: flex; align-items: center; justify-content: space-between; padding: var(--space-inset-150) var(--space-inset-200) var(--space-inset-050); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }

/* ---------- Canvas ---------- */
.canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: var(--space-inset-200) var(--space-inset-300) 0; background: var(--semantic-color-background-surface-default); }
.canvas-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-stack-100) var(--space-gap-150); min-height: 48px; }
.canvas-head .title { display: flex; align-items: center; gap: var(--space-gap-100); min-width: 0; flex: 1 0 auto; max-width: 100%; }
.canvas-head h2 { font: 600 20px/28px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas-head .tools { display: flex; align-items: center; gap: var(--space-gap-100); flex: none; margin-left: auto; }
.tag { display: inline-flex; align-items: center; gap: var(--space-gap-050); height: 24px; padding: 0 var(--space-inset-100); border-radius: var(--radius-round); background: var(--semantic-color-background-surface-bold); font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); white-space: nowrap; flex: none; }
.from { font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-secondary); white-space: nowrap; }
.pager { display: inline-flex; align-items: center; height: 40px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--semantic-color-border-bold); }
.pager .pg { padding: 0 var(--space-inset-050); font: 600 14px/20px var(--font); white-space: nowrap; }
.pager .sep { width: 1px; height: 24px; background: var(--semantic-color-border-default); }

.grid-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: var(--space-inset-150) 0; position: relative; }
.grid { display: grid; gap: var(--space-gap-150); }
.grid.anim { animation: zoomOut var(--motion-duration-slow) var(--motion-easing-ease-in-out); }
@keyframes zoomOut { from { transform: scale(1.06); opacity: .6; } to { transform: none; opacity: 1; } }

/* Viewcell (Viewcell + Viewcell status contracts) */
.vc { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: var(--semantic-color-media-background-default); background-size: cover; background-position: center; user-select: none; }
.vc .live-move { position: absolute; width: 6%; height: 26%; bottom: 22%; border-radius: 3px; background: rgba(255,255,255,0.16); animation: walk 9s ease-in-out infinite alternate; }
@keyframes walk { from { left: 18%; } to { left: 72%; } }
.vc .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, var(--semantic-color-media-background-overlay-subtle), transparent 30%); pointer-events: none; }
.vc-head { position: absolute; top: var(--space-inset-100); left: var(--space-inset-100); right: var(--space-inset-100); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-gap-100); pointer-events: none; }
.vc-status { display: inline-flex; align-items: center; gap: var(--space-gap-050); height: 32px; max-width: 100%; min-width: 0; padding: 0 var(--space-inset-150); border-radius: var(--radius-round); background: var(--semantic-color-media-background-overlay-default); color: var(--semantic-color-foreground-static); }
.vc-status .name { display: inline-flex; gap: var(--space-gap-100); min-width: 0; padding: 0 var(--space-inset-050); font: 600 14px/20px var(--font); }
.vc-status .name > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc-status .time { font-weight: 400; flex: none; }
.vc-status .site { font-weight: 400; color: var(--semantic-color-media-foreground-secondary); }
.badge-live { flex: none; height: 20px; padding: 0 var(--space-inset-075); border: 1px solid var(--semantic-color-media-foreground-live); border-radius: var(--radius-xs); font: 600 10px/18px var(--font); color: var(--semantic-color-media-foreground-live); }
.badge-live.pb { border-color: var(--semantic-color-media-foreground-secondary); color: var(--semantic-color-foreground-static); }
.vc .remove { position: absolute; top: var(--space-inset-100); right: var(--space-inset-100); display: none; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-round); background: var(--semantic-color-media-background-overlay-default); color: var(--semantic-color-foreground-static); }
.vc .remove:hover { background: var(--semantic-color-media-background-overlay-bold); }
.vc.editable:hover .remove { display: grid; }
.vc.editable:hover .badge-live { visibility: hidden; }
.vc.editable { cursor: grab; }
.vc-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-stack-100); background: var(--semantic-color-media-background-overlay-default); color: var(--semantic-color-foreground-static); font: 600 14px/20px var(--font); }
.vc.flash::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 4px var(--semantic-color-border-brand-default); animation: flash 1s var(--motion-easing-ease-out) forwards; pointer-events: none; }
@keyframes flash { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.vc.drop-target::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 4px var(--semantic-color-border-brand-default); pointer-events: none; }
.vc .replace-mask { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: var(--space-gap-100); background: var(--semantic-color-media-background-overlay-bold); color: var(--semantic-color-foreground-static); font: 600 14px/20px var(--font); }
.slot-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-stack-100); border: 1.5px dashed var(--semantic-color-border-bold); border-radius: var(--radius-sm); background: var(--semantic-color-media-background-empty); color: var(--semantic-color-foreground-secondary); font: 400 14px/20px var(--font); }
.slot-empty.drop-target { border-color: var(--semantic-color-border-brand-default); background: var(--semantic-color-action-brand-subtle-default); color: var(--semantic-color-foreground-brand); }
.zoomed { position: absolute; inset: var(--space-inset-150) 0; z-index: 2; }

.empty-state { display: flex; flex-direction: column; align-items: center; gap: var(--space-stack-100); color: var(--semantic-color-foreground-tertiary); }
.empty-state h3 { font: 600 20px/28px var(--font); color: var(--semantic-color-foreground-primary); }

/* ---------- Timeline (Timeline contract) ---------- */
.timeline { flex: none; display: flex; flex-direction: column; gap: var(--space-stack-050); padding: var(--space-inset-150) 0; border-top: 1px solid var(--semantic-color-border-subtle); background: var(--semantic-color-background-surface-default); }
.tl-actions { position: relative; display: flex; justify-content: space-between; align-items: center; gap: var(--space-gap-100); height: 40px; }
.tl-side { display: flex; align-items: center; gap: var(--space-gap-100); }
.tl-transport { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-gap-050); }
.tl-transport .btn[data-icon="only"] { border-radius: var(--radius-round); }
.time-pill { display: inline-flex; align-items: center; gap: var(--space-gap-100); height: 40px; padding: 0 var(--space-inset-150); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-round); background: var(--semantic-color-background-neutral-default); font: 600 14px/20px var(--font); }
.time-pill:hover { background: var(--semantic-color-background-neutral-hover); }
.time-pill[aria-expanded="true"] { border: 2px solid var(--semantic-color-border-brand-default); padding: 0 calc(var(--space-inset-150) - 1px); }
.tl-btn { display: inline-flex; align-items: center; gap: var(--space-gap-050); height: 40px; min-width: 64px; padding: 0 var(--space-inset-150); border: 0; border-radius: var(--radius-sm); background: none; font: 600 14px/20px var(--font); justify-content: center; }
.tl-btn:hover { background: var(--semantic-color-action-transparent-hover); }
.tl-area { position: relative; padding: var(--space-inset-100) 0; cursor: pointer; touch-action: none; }
.tl-area.panning { cursor: grabbing; }
.ruler { position: relative; height: 16px; border-bottom: 1px solid var(--semantic-color-border-default); margin-bottom: var(--space-stack-100); }
.ruler .tick { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--semantic-color-border-bold); }
.ruler .lbl { position: absolute; top: -6px; transform: translateX(-50%); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-tertiary); white-space: nowrap; }
.ruler .lbl.day { font-weight: 600; color: var(--semantic-color-foreground-secondary); }
.record { position: relative; height: 8px; background: var(--semantic-color-background-recessed-default); overflow: clip; }
.record .seg { position: absolute; top: 0; bottom: 0; background: var(--semantic-color-media-background-record); opacity: 0.45; }
.record .future { position: absolute; top: 0; bottom: 0; right: 0; background: var(--semantic-color-background-surface-default); }
.playhead { position: absolute; top: 4px; width: 2px; height: 53px; margin-left: -1px; border-radius: var(--radius-round); background: var(--semantic-color-foreground-primary); cursor: ew-resize; }
.playhead::before { content: ""; position: absolute; left: -7px; top: -4px; width: 16px; height: 16px; }
.playhead:focus-visible { outline: 2px solid var(--semantic-color-border-brand-subtle); outline-offset: 2px; }
.now-mark { position: absolute; top: 44px; font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); transform: translateX(6px); }
.tl-info { display: flex; align-items: center; justify-content: space-between; gap: var(--space-gap-150); height: 32px; }
.legend { display: flex; align-items: center; gap: var(--space-gap-150); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.legend .sw { display: inline-block; width: 8px; height: 8px; margin-right: var(--space-gap-050); background: var(--semantic-color-media-background-record); opacity: 0.45; }
.zoom { display: flex; align-items: center; gap: var(--space-gap-050); }
.slider { -webkit-appearance: none; appearance: none; width: 120px; height: 4px; border-radius: var(--radius-round); background: linear-gradient(var(--semantic-color-action-brand-default), var(--semantic-color-action-brand-default)) 0 / var(--pct, 50%) 100% no-repeat var(--semantic-color-background-recessed-bold); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: var(--radius-round); background: var(--semantic-color-action-brand-default); }
.slider:hover::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--semantic-color-border-interactive); }
.sync { display: flex; align-items: center; gap: var(--space-gap-150); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }

/* ---------- Menu / popover / tooltip ---------- */
.layer { position: fixed; inset: 0; z-index: var(--z-index-dropdown); }
.menu { position: fixed; min-width: 200px; max-width: 400px; padding: var(--space-inset-100); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-lg); background: var(--semantic-color-background-raised-bolder); box-shadow: var(--shadow-md); z-index: var(--z-index-dropdown); }
.menu .item { display: flex; align-items: center; gap: var(--space-gap-100); width: 100%; height: 40px; padding: 0 var(--space-inset-200); border: 0; border-radius: var(--radius-sm); background: none; font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-primary); text-align: left; white-space: nowrap; }
.menu .item:hover { background: var(--semantic-color-background-neutral-hover); }
.menu .item[aria-checked="true"] { background: var(--semantic-color-background-neutral-selected); }
.menu .item .chk { width: 20px; flex: none; color: var(--semantic-color-foreground-primary); }
.menu .item[aria-disabled="true"] { color: var(--semantic-color-foreground-disabled); cursor: default; background: none; }
.menu .item.danger { color: var(--semantic-color-feedback-foreground-danger); }
.menu .sep { height: 1px; margin: var(--space-stack-100) 0; background: var(--semantic-color-border-default); }
.popover { position: fixed; width: 400px; padding: var(--space-inset-200); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-lg); background: var(--semantic-color-background-raised-bolder); box-shadow: var(--shadow-md); z-index: var(--z-index-dropdown); display: flex; flex-direction: column; gap: var(--space-stack-150); }
.popover h4 { margin: 0; font: 600 16px/22px var(--font); }
.popover p { font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-secondary); }
.popover .acts { display: flex; justify-content: flex-end; gap: var(--space-gap-100); flex-wrap: wrap; }
.tooltip { position: fixed; padding: var(--space-inset-100) var(--space-inset-150); border-radius: var(--radius-sm); background: var(--semantic-color-background-recessed-bold); color: var(--semantic-color-foreground-primary); font: 400 14px/20px var(--font); max-width: 320px; z-index: var(--z-index-tooltip); pointer-events: none; animation: fade var(--motion-duration-fast) var(--motion-easing-ease-out); }
@keyframes fade { from { opacity: 0; } }

/* ---------- Dialog ---------- */
.backdrop { position: fixed; inset: 0; background: var(--semantic-color-background-overlay); z-index: var(--z-index-modal); display: grid; place-items: center; animation: fade var(--motion-duration-fast); }
.dialog { display: flex; flex-direction: column; width: var(--size-dialog-width-md); max-height: 90vh; border: 1px solid var(--semantic-color-border-subtle); border-radius: var(--radius-lg); background: var(--semantic-color-background-raised-default); box-shadow: var(--shadow-md); overflow: clip; }
.dialog.sm { width: var(--size-dialog-width-sm); }
.dialog .d-title { display: flex; align-items: center; gap: var(--space-gap-050); padding: var(--space-inset-200) var(--space-inset-200) var(--space-inset-200) var(--space-inset-300); }
.dialog .d-title h2 { flex: 1; font: 600 24px/34px var(--font); }
.dialog .d-content { flex: 1; overflow-y: auto; padding: var(--space-inset-100) var(--space-inset-300) var(--space-inset-300); display: flex; flex-direction: column; gap: var(--space-stack-200); font: 400 14px/20px var(--font); }
.dialog .d-buttons { display: flex; justify-content: flex-end; gap: var(--space-gap-200); padding: var(--space-inset-100) var(--space-inset-300) var(--space-inset-300); }
.field { display: flex; flex-direction: column; gap: var(--space-stack-050); }
.field label, .field .lbl { font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.field input { height: 40px; padding: 0 var(--space-inset-150); border: 1px solid var(--semantic-color-border-bold); border-radius: var(--radius-sm); background: var(--semantic-color-background-neutral-default); font: 400 14px/20px var(--font); color: var(--semantic-color-foreground-primary); }
.field input:focus-visible { outline: 0; border: 2px solid var(--semantic-color-border-brand-default); padding: 0 calc(var(--space-inset-150) - 1px); }
.field[data-state="error"] label, .field .err { color: var(--semantic-color-feedback-foreground-danger); }
.field[data-state="error"] input { border-color: var(--semantic-color-border-danger-default); }
.field .err { font: 400 12px/16px var(--font); }
.row2 { display: flex; gap: var(--space-gap-200); }
.row2 > * { flex: 1; }
.check-list { display: flex; flex-direction: column; max-height: 220px; overflow-y: auto; border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-sm); padding: var(--space-inset-050); }
.check-item { display: flex; align-items: center; gap: var(--space-gap-100); min-height: 40px; padding: 0 var(--space-inset-100); border-radius: var(--radius-sm); font: 400 14px/20px var(--font); cursor: pointer; }
.check-item:hover { background: var(--semantic-color-background-neutral-hover); }
.check-item .sub { color: var(--semantic-color-foreground-secondary); }
.radio { display: inline-flex; align-items: center; gap: var(--space-gap-100); }
.radio .rd { width: 20px; height: 20px; border-radius: var(--radius-round); border: 6px solid var(--semantic-color-action-brand-default); }
.progress { height: 4px; border-radius: var(--radius-round); background: var(--semantic-color-background-recessed-bold); overflow: hidden; }
.progress > div { height: 100%; background: var(--semantic-color-action-brand-default); transition: width 200ms linear; }

/* ---------- Toast (Alert contract) ---------- */
.toasts { position: fixed; top: var(--space-inset-300); right: var(--space-inset-300); display: flex; flex-direction: column; gap: var(--space-stack-100); z-index: var(--z-index-toast); }
.toast { display: flex; align-items: center; gap: var(--space-gap-100); width: 360px; padding: var(--space-inset-100) var(--space-inset-150); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-sm); background: var(--semantic-color-feedback-background-info-subtlest); box-shadow: var(--shadow-md); font: 400 14px/20px var(--font); animation: slideIn var(--motion-duration-slow) var(--motion-easing-ease-out); }
.toast .msg { flex: 1; }
.toast svg { color: var(--semantic-color-feedback-foreground-info); flex: none; }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }

/* ---------- Moderator panel ---------- */
.mod { position: fixed; right: var(--space-inset-200); bottom: var(--space-inset-200); width: 380px; max-height: calc(100vh - 32px); overflow-y: auto; padding: var(--space-inset-200); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-lg); background: var(--semantic-color-background-raised-bolder); box-shadow: var(--shadow-md); z-index: var(--z-index-tooltip); display: flex; flex-direction: column; gap: var(--space-stack-150); font: 400 13px/18px var(--font); }
.mod h3 { font: 600 16px/22px var(--font); display: flex; justify-content: space-between; align-items: center; }
.mod .grp { display: flex; flex-direction: column; gap: var(--space-stack-050); }
.mod .grp > .lbl { font: 600 12px/16px var(--font); color: var(--semantic-color-foreground-secondary); }
.mod .chips { display: flex; flex-wrap: wrap; gap: var(--space-gap-050); }
.mod .chip { height: 28px; padding: 0 var(--space-inset-100); border: 1px solid var(--semantic-color-border-default); border-radius: var(--radius-round); background: var(--semantic-color-background-neutral-default); font: 600 12px/16px var(--font); }
.mod .chip:hover { background: var(--semantic-color-background-neutral-hover); }
.mod .chip[aria-pressed="true"] { background: var(--semantic-color-action-brand-default); border-color: transparent; color: var(--semantic-color-foreground-static); }
.mod .note { color: var(--semantic-color-foreground-secondary); font: 400 12px/16px var(--font); }
.mod .log { max-height: 140px; overflow-y: auto; font: 400 11px/15px var(--font-code); background: var(--semantic-color-background-surface-bold); border-radius: var(--radius-xs); padding: var(--space-inset-100); white-space: pre-wrap; }

.vc .flash-ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 4px var(--semantic-color-border-brand-default); animation: flash 1.2s var(--motion-easing-ease-out) forwards; pointer-events: none; }
.slot-blank { }
.thumb .st { position: absolute; top: var(--space-inset-075); right: var(--space-inset-100); display: inline-flex; align-items: center; gap: var(--space-gap-050); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-static); text-shadow: var(--shadow-foreground); z-index: 1; }
.vc .site-lbl { position: absolute; left: var(--space-inset-150); bottom: var(--space-inset-100); right: var(--space-inset-150); font: 400 12px/16px var(--font); color: var(--semantic-color-foreground-static); text-shadow: var(--shadow-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
